name: smart_guide
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  animate_do: ^4.2.0
  animated_bottom_navigation_bar: ^1.4.0
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  go_router: ^17.1.0
  google_fonts: ^8.0.1
  image_picker: ^1.2.1
  lottie: ^3.3.2
  pin_code_fields: ^8.0.1
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  build_runner: ^2.11.1
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/png/logo_with_text.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/images/svg/
    - assets/translations/
    - assets/lottie/
