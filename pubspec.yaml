name: smart_guide
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  animate_do: ^4.2.0
  animated_bottom_navigation_bar: ^1.4.0
  country_icons: ^3.0.0
  animated_snack_bar: ^0.4.0
  awesome_snackbar_content: ^0.1.8
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.2
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  fl_chart: ^0.70.2
  flutter_stripe: ^11.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  go_router: ^17.1.0
  google_fonts: ^8.0.1
  google_sign_in: ^6.2.1
  image_picker: ^1.2.1
  jwt_decoder: ^2.0.1
  lottie: ^3.3.2
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  connectivity_plus: ^7.1.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  readmore: ^2.2.0
  # flutter_stripe: ^12.6.0

dev_dependencies:
  build_runner: ^2.11.1
  easy_localization_generator: ^0.3.5
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/png/logo_with_text.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/images/svg/
    - assets/images/gif/
    - assets/translations/
    - assets/lottie/


##### GENERATED ASSET FOLDER
flutter_assets:
  assets_path: assets/
  output_path: lib/generated/
  filename: assets.dart
  field_prefix: null